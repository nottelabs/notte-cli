<!doctype html>
<html lang="en" data-app="notte-cli-playground">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>notte CLI playground</title>
  <style>
    :root{font-family:Monaco,Menlo,Consolas,monospace;font-size:12px;line-height:1.3;color:#c0caf5;background:#101116;color-scheme:dark}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{display:grid;place-items:center}input{font:inherit}[hidden]{display:none!important}::selection{background:#414868;color:#c0caf5}
    .terminal{position:relative;display:flex;flex-direction:column;flex:0 1 1100px;min-width:0;height:78vh;overflow:hidden;border:1px solid #65646c;border-radius:9px;background:#1a1b26;box-shadow:0 20px 65px #0006}
    .titlebar{position:relative;display:flex;align-items:center;justify-content:center;flex-shrink:0;height:29px;background:#3b3b3d;border-bottom:1px solid #15151c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#b6b6b8;font-size:12px;font-weight:600;user-select:none}
    .lights{position:absolute;left:10px;display:flex;gap:7px}.light{width:11px;height:11px;border-radius:50%}.red{background:#ff5f57}.yellow{background:#febc2e}.green{background:#28c840}
    .version{font:500 11px Monaco,Menlo,Consolas,monospace;color:#8f8f95}
    .screen{flex:1;min-height:0;overflow:auto;padding:8px 8px 14px;scrollbar-color:#666779 #1a1b26;scrollbar-width:thin}
    .line{display:flex;gap:6px;align-items:baseline;min-width:0}.prompt{color:#7aa2f7;flex-shrink:0;user-select:none;white-space:nowrap}.prompt b{color:#c0caf5;font-weight:400}
    .command,.output{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;min-width:0;tab-size:4}.output:empty{display:none}.note{color:#737caa}
    .input-wrap{position:relative;flex:1;min-width:0;overflow:hidden}
    .input{font:inherit;line-height:1.3;display:block;width:100%;border:0;padding:0;margin:0;background:transparent;color:#c0caf5;outline:none;caret-color:transparent}
    .caret{position:absolute;top:0;width:1ch;height:1.3em;background:#c0caf5;color:#15161e;pointer-events:none;white-space:pre}
    .layout{display:flex;justify-content:center;width:92vw;height:78vh}
    .sidebar{width:220px;margin-right:28px;flex-shrink:0;overflow-x:hidden;overflow-y:auto;transition:width .32s cubic-bezier(.4,0,.2,1),margin-right .32s cubic-bezier(.4,0,.2,1),opacity .2s ease;padding:4px 4px 16px 0;font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;scrollbar-width:thin;scrollbar-color:#3b3d52 transparent}
    .sidebar-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}.sidebar h2{margin:0;font-size:15px;font-weight:600;color:#e6e8f2}
    .sidebar h3{margin:22px 0 8px;font-size:12px;font-weight:600;color:#8b90ab;text-transform:uppercase;letter-spacing:.04em}
    .nav{border-left:1px solid #2a2e42;margin:0;padding:0;list-style:none}
    .nav button{display:block;width:100%;margin-left:-1px;padding:6px 0 6px 16px;border:0;border-left:1px solid transparent;background:none;color:#a9b1d6;font:inherit;text-align:left;cursor:pointer}
    .nav button:hover{color:#e6e8f2;border-left-color:#565f89}
    .nav button.active{color:#4ade80;border-left-color:#4ade80}
    .nav .sub{list-style:none;margin:2px 0 6px;padding:0}
    .nav .sub button{padding:4px 0 4px 30px;font-size:13px;font-family:Monaco,Menlo,Consolas,monospace;color:#8b90ab}
    .nav .sub button:hover{color:#e6e8f2}
    .toggle{display:grid;place-items:center;width:28px;height:28px;padding:0;border:1px solid transparent;border-radius:6px;background:none;color:#8b90ab;cursor:pointer}
    .toggle:hover{color:#e6e8f2;background:#1f2233;border-color:#2a2e42}
    .open-sidebar{position:fixed;top:20px;left:20px;z-index:1}
    .sidebar>*{width:216px}
    body.collapsed .sidebar{width:0;margin-right:0;padding-right:0;opacity:0;pointer-events:none}
    .open-sidebar{transition:opacity .2s ease .15s}
    body:not(.collapsed) .open-sidebar{opacity:0;pointer-events:none;transition-delay:0s}
    @media(prefers-reduced-motion:reduce){.sidebar,.open-sidebar{transition:none}}
    body.preload .sidebar,body.preload .open-sidebar{transition:none}

    .output a{color:inherit;text-decoration:underline;text-decoration-color:#565f89;text-underline-offset:2px;cursor:pointer}.output a:hover{color:#7dcfff;text-decoration-color:currentColor}
    .stale{opacity:.38}
    .build-badge{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:6px 14px;border:1px solid #3b4261;border-radius:999px;background:#24283bf2;color:#c0caf5;font:500 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;box-shadow:0 6px 24px #0007;pointer-events:none}
    .spinner{width:11px;height:11px;border:2px solid #565f89;border-top-color:#7aa2f7;border-radius:50%;animation:spin .8s linear infinite}

    body.building #form{opacity:.35}
    @media(prefers-reduced-motion:reduce){.spinner{animation:none}}
    .modes{position:absolute;right:12px;display:flex;align-items:center;gap:10px}
    .mode{display:flex;padding:2px;border-radius:6px;background:#2a2a2c}

    .mode button.on{background:#4a4a4e;color:#f0f0f2}
    .notice{margin:4px 0;color:#e0af68;white-space:pre-wrap;font:inherit}.notice.failed{color:#f7768e}
    @media(max-width:650px){.terminal{width:96vw;height:88dvh}}
  </style>
</head>
<body>
  <button id="open-sidebar" class="toggle open-sidebar" type="button" title="Show commands" aria-label="Show commands"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M6 2.5v11"/></svg></button>
  <div class="layout">
  <nav id="sidebar" class="sidebar" aria-label="CLI commands"></nav>
  <main class="terminal" aria-label="notte CLI playground">
    <div class="titlebar"><div class="lights" aria-hidden="true"><span class="light red"></span><span class="light yellow"></span><span class="light green"></span></div><div class="modes"><div id="mode" class="mode" role="group" aria-label="Where notte commands go" hidden><button type="button" data-mode="live" title="Run against the real Notte API with the playground's login. Read-only commands re-run on every rebuild.">Live API</button><button type="button" data-mode="fixtures" title="Run against the fake API answers in scenarios.json, re-run on every rebuild">Fixtures</button></div><span id="version" class="version" title="CLI version: latest release tag, commits since it, and -dirty for uncommitted changes"></span></div></div>
    <div id="screen" class="screen">
      <div id="transcript" role="log" aria-live="polite"></div>
      <pre id="notice" class="notice" role="status" hidden></pre>
      <form id="form" class="line" autocomplete="off" spellcheck="false">
        <span id="prompt" class="prompt" aria-hidden="true"></span>
        <div class="input-wrap"><input id="input" class="input" aria-label="Command" autocomplete="off" autocapitalize="off" spellcheck="false"><span id="caret" class="caret" aria-hidden="true"></span></div>
      </form>
    </div>
    <div id="build-badge" class="build-badge" role="status" hidden><span class="spinner" aria-hidden="true"></span>Rebuilding CLI…</div>
  </main>
  </div>
  <script>
'use strict';
// Everything below runs in the visitor's browser. The shell is a small
// emulator over an in-memory filesystem. In a static export, notte is the
// real CLI compiled to WebAssembly (see "the real CLI in the browser").
const STATIC = document.documentElement.dataset.mode === 'static';
const STORAGE = 'notte-playground-v1';
const HOME = '/home/user';
const $ = id => document.getElementById(id);
const input = $('input');

// ---------- ANSI rendering ----------
const COLORS = ['#15161e','#f7768e','#9ece6a','#e0af68','#7aa2f7','#bb9af7','#7dcfff','#a9b1d6','#414868','#f7768e','#9ece6a','#e0af68','#7aa2f7','#bb9af7','#7dcfff','#c0caf5'];
const strip = v => String(v || '').replace(/\x1b\][^\x07]*(?:\x07|\x1b\\)/g,'').replace(/\x1b\[[0-?]*[ -/]*[@-~]/g,'');
function palette(i) {
  if (i < 16) return COLORS[i];
  if (i >= 232) { const g = 8 + (i - 232) * 10; return `rgb(${g},${g},${g})`; }
  const n = i - 16;
  return 'rgb(' + [Math.floor(n / 36), Math.floor(n / 6) % 6, n % 6].map(v => v ? 55 + v * 40 : 0).join(',') + ')';
}
// URLs in output are clickable, like in iTerm or VS Code's terminal. Text
// inside an OSC 8 hyperlink escape links to its target instead.
const URL_PATTERN = /\bhttps?:\/\/[^\s<>"'`]*[^\s<>"'`.,;:!?)\]}]/g;
function link(href, text, style) {
  const a = document.createElement('a');
  a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer';
  a.textContent = text; Object.assign(a.style, style);
  return a;
}
function renderANSI(target, text) {
  // Keep OSC 8 hyperlinks, drop other OSC sequences (titles and the like).
  text = String(text || '').replace(/\x1b\](?!8;)[^\x07\x1b]*(?:\x07|\x1b\\)/g, '');
  const re = /\x1b\[([0-9;]*)m|\x1b\]8;[^;\x07\x1b]*;([^\x07\x1b]*)(?:\x07|\x1b\\)/g;
  let cursor = 0, m, style = {}, href = '';
  const add = part => {
    part = part.replace(/\x1b\[[0-?]*[ -/]*[@-~]/g, '');
    if (!part) return;
    if (href && /^https?:\/\//.test(href)) { target.appendChild(link(href, part, style)); return; }
    let last = 0;
    for (const match of part.matchAll(URL_PATTERN)) {
      if (match.index > last) { const span = document.createElement('span'); span.textContent = part.slice(last, match.index); Object.assign(span.style, style); target.appendChild(span); }
      target.appendChild(link(match[0], match[0], style));
      last = match.index + match[0].length;
    }
    if (last < part.length) { const span = document.createElement('span'); span.textContent = part.slice(last); Object.assign(span.style, style); target.appendChild(span); }
  };
  while ((m = re.exec(text))) {
    add(text.slice(cursor, m.index)); cursor = re.lastIndex;
    if (m[1] === undefined) { href = m[2] || ''; continue; }
    const c = (m[1] || '0').split(';').map(Number);
    for (let i = 0; i < c.length; i++) {
      const k = c[i];
      if (k === 0) style = {};
      else if (k === 1) style.fontWeight = '700';
      else if (k === 2) style.opacity = '.65';
      else if (k === 3) style.fontStyle = 'italic';
      else if (k === 4) style.textDecoration = 'underline';
      else if (k === 22) { delete style.fontWeight; delete style.opacity; }
      else if (k === 23) delete style.fontStyle;
      else if (k === 24) delete style.textDecoration;
      else if (k >= 30 && k <= 37) style.color = COLORS[k - 30];
      else if (k >= 90 && k <= 97) style.color = COLORS[k - 82];
      else if (k === 39) delete style.color;
      else if (k >= 40 && k <= 47) style.backgroundColor = COLORS[k - 40];
      else if (k === 49) delete style.backgroundColor;
      else if ((k === 38 || k === 48) && c[i + 1] === 5) { style[k === 38 ? 'color' : 'backgroundColor'] = palette(c[i + 2]); i += 2; }
      else if ((k === 38 || k === 48) && c[i + 1] === 2) { style[k === 38 ? 'color' : 'backgroundColor'] = `rgb(${c[i + 2]},${c[i + 3]},${c[i + 4]})`; i += 4; }
    }
  }
  add(text.slice(cursor));
}

// ---------- persistent state ----------
const welcome = document.documentElement.dataset.mode === 'static' ? `notte CLI playground
The real notte CLI, running in this tab. Shell commands (ls, cat, jq, ...) work on a pretend filesystem.
Try typing: notte auth login
` : `notte CLI playground (live)
Shell commands (ls, cat, jq, ...) work on a pretend filesystem in this tab.
Try typing: notte auth login
`;
function freshFS() {
  return {type: 'dir', children: {home: {type: 'dir', children: {user: {type: 'dir', children: {}}}}, tmp: {type: 'dir', children: {}}}};
}
const state = {fs: freshFS(), cwd: HOME, env: {USER: 'user', HOME, SHELL: '/bin/bash', PATH: '/usr/local/bin:/usr/bin:/bin'}, history: [], session: '', auth: 'saved', entries: []};
let preview = null, historyIndex = 0, draft = '';
function save() {
  try { localStorage.setItem(STORAGE, JSON.stringify({...state, entries: state.entries.slice(-80)})); } catch { /* storage full or disabled */ }
}
function restore() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE));
    if (saved && saved.fs && saved.fs.type === 'dir') Object.assign(state, saved);
  } catch { /* start fresh */ }
  historyIndex = state.history.length;
}

// ---------- filesystem ----------
function resolve(path) {
  path = String(path || '');
  if (path === '~' || path.startsWith('~/')) path = HOME + path.slice(1);
  const parts = (path.startsWith('/') ? path : state.cwd + '/' + path).split('/');
  const out = [];
  for (const p of parts) { if (!p || p === '.') continue; if (p === '..') out.pop(); else out.push(p); }
  return '/' + out.join('/');
}
function lookup(abs) {
  let node = state.fs;
  for (const part of abs.split('/').filter(Boolean)) {
    if (node.type !== 'dir' || !node.children[part]) return null;
    node = node.children[part];
  }
  return node;
}
function parentOf(abs) {
  const i = abs.lastIndexOf('/');
  return {dir: lookup(abs.slice(0, i) || '/'), name: abs.slice(i + 1)};
}
function pretty(abs) { return abs === HOME ? '~' : abs.startsWith(HOME + '/') ? '~' + abs.slice(HOME.length) : abs; }
function writeFile(path, content, append) {
  const abs = resolve(path);
  if (abs === '/dev/null') return '';
  const {dir, name} = parentOf(abs);
  if (!dir || dir.type !== 'dir') return `${path}: No such file or directory`;
  const existing = dir.children[name];
  if (existing && existing.type === 'dir') return `${path}: Is a directory`;
  dir.children[name] = {type: 'file', content: (append && existing ? existing.content : '') + content};
  return '';
}
function readFile(path) {
  const node = lookup(resolve(path));
  if (!node) return {err: `${path}: No such file or directory`};
  if (node.type === 'dir') return {err: `${path}: Is a directory`};
  if (node.binary) return {err: `${path}: binary file (${node.size} bytes); run "open ${path}" to view it`};
  return {content: node.content};
}

// ---------- tokenizer and parser ----------
// Produces a list of {op, pipeline} where pipeline is a list of commands with
// argv and redirections. Supports quotes, $VAR, ~, |, >, >>, 2>, 2>&1, &&, ||, ;.
function tokenize(line) {
  const tokens = [];
  let cur = '', has = false, i = 0;
  const push = () => { if (has) tokens.push({word: cur}); cur = ''; has = false; };
  const variable = () => {
    let name = '';
    if (line[i + 1] === '{') { const end = line.indexOf('}', i); if (end < 0) throw new Error('bad substitution'); name = line.slice(i + 2, end); i = end; }
    else if (line[i + 1] === '?') { name = '?'; i++; }
    else { while (/[A-Za-z0-9_]/.test(line[i + 1] || '')) name += line[++i]; }
    if (!name) return '$';
    return name === '?' ? String(state.lastCode || 0) : (state.env[name] ?? '');
  };
  for (; i < line.length; i++) {
    const ch = line[i];
    if (ch === '\\') { cur += line[++i] ?? ''; has = true; }
    else if (ch === "'") { const end = line.indexOf("'", i + 1); if (end < 0) throw new Error('unexpected EOF while looking for matching `\''); cur += line.slice(i + 1, end); i = end; has = true; }
    else if (ch === '"') {
      has = true;
      for (i++; i < line.length && line[i] !== '"'; i++) {
        if (line[i] === '\\' && /["\\$`]/.test(line[i + 1])) cur += line[++i];
        else if (line[i] === '$') cur += variable();
        else cur += line[i];
      }
      if (i >= line.length) throw new Error('unexpected EOF while looking for matching `"\'');
    }
    else if (ch === '$') { cur += variable(); has = true; }
    else if (ch === '~' && !has && (line[i + 1] === undefined || line[i + 1] === '/' || /\s/.test(line[i + 1]))) { cur += HOME; has = true; }
    else if (/\s/.test(ch)) push();
    else if (ch === '#' && !has) break;
    else if (ch === '2' && !has && line[i + 1] === '>') {
      push();
      if (line.slice(i, i + 4) === '2>&1') { tokens.push({op: '2>&1'}); i += 3; }
      else { tokens.push({op: '2>'}); i++; }
    }
    else if ('|&;><'.includes(ch)) {
      push();
      const two = line.slice(i, i + 2);
      if (['&&', '||', '>>'].includes(two)) { tokens.push({op: two}); i++; }
      else if (ch === '&') throw new Error('background jobs are not supported in the playground');
      else tokens.push({op: ch});
    }
    else { cur += ch; has = true; }
  }
  push();
  return tokens;
}
function parse(line) {
  const tokens = tokenize(line);
  const list = [];
  let op = ';', pipeline = [], cmd = {argv: [], out: null, err: null, errToOut: false, in: null};
  const endCmd = () => {
    if (!cmd.argv.length) throw new Error('syntax error near unexpected token');
    pipeline.push(cmd); cmd = {argv: [], out: null, err: null, errToOut: false, in: null};
  };
  for (let i = 0; i < tokens.length; i++) {
    const t = tokens[i];
    if (t.word !== undefined) { cmd.argv.push(t.word); continue; }
    if (['>', '>>', '2>', '<'].includes(t.op)) {
      const target = tokens[++i];
      if (!target || target.word === undefined) throw new Error('syntax error near unexpected token `newline\'');
      if (t.op === '<') cmd.in = target.word;
      else if (t.op === '2>') cmd.err = {path: target.word, append: false};
      else cmd.out = {path: target.word, append: t.op === '>>'};
    } else if (t.op === '2>&1') cmd.errToOut = true;
    else if (t.op === '|') endCmd();
    else { endCmd(); list.push({op, pipeline}); op = t.op; pipeline = []; }
  }
  if (cmd.argv.length || pipeline.length) { endCmd(); list.push({op, pipeline}); }
  return list;
}

// ---------- shell builtins ----------
// Each returns {out, err, code}. ctx.tty tells whether stdout is the terminal.
const ok = (out = '') => ({out, err: '', code: 0});
const fail = (err, code = 1) => ({out: '', err: err.endsWith('\n') ? err : err + '\n', code});
const lines = s => { const l = s.split('\n'); if (l[l.length - 1] === '') l.pop(); return l; };
function filesFrom(args, stdin, name, fn) {
  if (!args.length) return ok(fn(stdin));
  let out = '', err = '', code = 0;
  for (const a of args) {
    const f = readFile(a);
    if (f.err) { err += `${name}: ${f.err}\n`; code = 1; } else out += fn(f.content, a);
  }
  return {out, err, code};
}
function countFlag(args, def) {
  let n = def; const rest = [];
  for (let i = 0; i < args.length; i++) {
    if (args[i] === '-n') n = parseInt(args[++i], 10);
    else if (/^-\d+$/.test(args[i])) n = parseInt(args[i].slice(1), 10);
    else rest.push(args[i]);
  }
  return {n: isNaN(n) ? def : n, rest};
}
const builtins = {
  help: () => ok(`Shell commands (pretend filesystem, in your browser):
  pwd cd ls cat echo mkdir touch rm mv cp tree
  grep head tail wc sort uniq jq env export history clear date whoami

Shell syntax: | > >> 2> 2>&1 && || ; quotes, $VARS, ~

The CLI:
  notte                      overview of every command
  notte <command> --help     help for one command

notte runs the real CLI (live server) or replays recordings of it (static export).
Run "reset" to wipe the playground and start over.
`),
  pwd: () => ok(state.cwd + '\n'),
  cd: args => {
    const target = resolve(args[0] || HOME);
    const node = lookup(target);
    if (!node) return fail(`cd: ${args[0]}: No such file or directory`);
    if (node.type !== 'dir') return fail(`cd: ${args[0]}: Not a directory`);
    state.cwd = target; return ok();
  },
  ls: args => {
    const long = args.some(a => /^-[a-zA-Z]*l/.test(a)), all = args.some(a => /^-[a-zA-Z]*a/.test(a));
    const paths = args.filter(a => !a.startsWith('-'));
    let out = '', err = '', code = 0;
    const list = (p, header) => {
      const node = lookup(resolve(p));
      if (!node) { err += `ls: ${p}: No such file or directory\n`; code = 1; return; }
      if (header) out += `${p}:\n`;
      if (node.type === 'file') { out += p + '\n'; return; }
      const names = Object.keys(node.children).sort();
      if (all) names.unshift('.', '..');
      const label = n => node.children[n]?.type === 'dir' ? `\x1b[1;34m${n}\x1b[0m` : n;
      if (long) for (const n of names) {
        const c = node.children[n] || {type: 'dir'};
        out += `${c.type === 'dir' ? 'drwxr-xr-x' : '-rw-r--r--'}  1 user  staff  ${String(c.type === 'dir' ? 64 : c.content.length).padStart(6)} ${label(n)}\n`;
      } else if (names.length) out += names.map(label).join('  ') + '\n';
    };
    if (!paths.length) list('.');
    paths.forEach(p => list(p, paths.length > 1));
    return {out, err, code};
  },
  cat: (args, stdin) => filesFrom(args.filter(a => a !== '-'), stdin, 'cat', c => c),
  echo: args => {
    let newline = true;
    if (args[0] === '-n') { newline = false; args = args.slice(1); }
    return ok(args.join(' ') + (newline ? '\n' : ''));
  },
  mkdir: args => {
    const parents = args.includes('-p');
    for (const a of args.filter(a => !a.startsWith('-'))) {
      const abs = resolve(a);
      if (parents) {
        let node = state.fs;
        for (const part of abs.split('/').filter(Boolean)) {
          node.children[part] ||= {type: 'dir', children: {}};
          node = node.children[part];
          if (node.type !== 'dir') return fail(`mkdir: ${a}: Not a directory`);
        }
        continue;
      }
      const {dir, name} = parentOf(abs);
      if (!dir) return fail(`mkdir: ${a}: No such file or directory`);
      if (dir.type !== 'dir') return fail(`mkdir: ${a}: Not a directory`);
      if (dir.children[name]) return fail(`mkdir: ${a}: File exists`);
      dir.children[name] = {type: 'dir', children: {}};
    }
    return ok();
  },

requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.remove('preload')));
$('open-sidebar').onclick = () => setSidebar(true);
function describe(path) {
  const out = {};
  let listing = false;
  for (const line of strip(helpPage(path)?.stdout).split('\n')) {
    if (/Commands:$/.test(line.trim())) { listing = true; continue; }
    if (!line.trim()) { listing = false; continue; }
    const m = listing && line.match(/^\s+(\S+)\s+(.*)$/);
    if (m) out[m[1]] = m[2];
  }
  return out;
}
function useCommand(words) {
  input.value = 'notte ' + words.join(' ') + ' ';
  input.focus({preventScroll: true});
  input.setSelectionRange(input.value.length, input.value.length);
  requestAnimationFrame(updateCaret);
}
function navButton(label, title, onClick, active) {
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = label; b.title = title || ''; b.onclick = onClick;
  if (active) b.className = 'active';
  return b;
}
function renderSidebar() {
  const top = describe([]);
  const names = Object.keys(top).filter(n => n !== 'help' && n !== 'completion');
  const groups = names.filter(n => childrenOf([n]).length), others = names.filter(n => !childrenOf([n]).length);
  const nav = $('sidebar');
  const heading = text => { const h = document.createElement('h2'); h.textContent = text; return h; };
  const list = document.createElement('ul'); list.className = 'nav';
  for (const name of groups) {
    const li = document.createElement('li');
    li.appendChild(navButton(name[0].toUpperCase() + name.slice(1), top[name], () => { openGroup = openGroup === name ? '' : name; renderSidebar(); }, openGroup === name));
    if (openGroup === name) {
      const sub = document.createElement('ul'); sub.className = 'sub';
      const subs = describe([name]);
      for (const child of Object.keys(subs).filter(n => n !== 'help')) {
        const item = document.createElement('li');
        item.appendChild(navButton(child, subs[child], () => useCommand([name, child])));
        sub.appendChild(item);
      }
      li.appendChild(sub);
    }
    list.appendChild(li);
  }
  const rest = document.createElement('ul'); rest.className = 'nav';
  for (const name of others) {
    const li = document.createElement('li');
    li.appendChild(navButton(name, top[name], () => useCommand([name])));
    rest.appendChild(li);
  }
  const other = document.createElement('h3'); other.textContent = 'Other commands';
  const head = document.createElement('div'); head.className = 'sidebar-head';
  const hide = document.createElement('button');
  hide.type = 'button'; hide.className = 'toggle'; hide.title = 'Hide commands'; hide.setAttribute('aria-label', 'Hide commands');
  hide.innerHTML = SIDEBAR_ICON; hide.onclick = () => setSidebar(false);
  head.append(heading('Commands'), hide);
  nav.replaceChildren(head, list, other, rest);
}

// ---------- recordings ----------
function setNotice(text, failed) { $('notice').textContent = text; $('notice').hidden = !text; $('notice').className = 'notice' + (failed ? ' failed' : ''); }
// After a rebuild or a fixture edit, re-run the last command in fixtures mode
// and dim its previous output above the new one.
function rerunLast() {
  for (const entry of state.entries) entry.stale = true;
  renderAll();
  submit(lastRunLine, true);
}
function setMode(next) {
  // A command tried against fixtures must not re-run against the real API.
  if (next !== mode) { lastRunLine = ''; lastRunSafe = false; }
  mode = next;
  try { localStorage.setItem(STORAGE + '-mode', mode); } catch { /* not remembered */ }
  for (const b of $('mode').querySelectorAll('button')) b.classList.toggle('on', b.dataset.mode === mode);
  input.focus({preventScroll: true});
}
if (LIVE) {
  $('mode').hidden = false;
  for (const b of $('mode').querySelectorAll('button')) b.onclick = () => setMode(b.dataset.mode);
  setMode(mode);
}
// While the CLI rebuilds, the terminal takes no commands: a command typed
// now would run the old build or wait for the new one.
function setBuilding(on) {
  $('build-badge').hidden = !on;
  document.body.classList.toggle('building', on);
  input.readOnly = on;
}
async function loadPreview() {
  try {
    const res = await fetch(STATIC ? './preview.json' : '/api/preview', {cache: 'no-store'});
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data.error) setNotice('CLI build failed. Showing the last good recordings.\n' + data.error, true);
    else setNotice('');
    setBuilding(!!data.building);
    const changed = preview && !data.building && !data.error && (data.revision !== preview.revision || data.fixtures !== preview.fixtures);
    if (data.help && Object.keys(data.help).length) { preview = data; flagCache.clear(); aliasCache.clear(); renderSidebar(); }
    if (changed && lastRunLine && !busy) {
      if (lastRunSafe) rerunLast();
      else setNotice(`Rebuilt. Press ↑ Enter to run "${lastRunLine}" again; it changes something, so it does not re-run by itself.`);
    }
    $('version').textContent = preview?.version && preview.version !== 'dev' ? preview.version : '';
  } catch (e) { setNotice('Could not load the CLI recordings: ' + e.message, true); }
}
restore();
// Earlier versions seeded README.txt, and test runs left s.json behind.
for (const name of ['README.txt', 's.json']) delete lookup(HOME)?.children?.[name];
if (!state.entries.length) state.entries.push({output: [{text: welcome}]});
// The welcome banner is the only entry without a command; keep it current.
for (const entry of state.entries) if (entry.line === undefined) entry.output = [{text: welcome}];
renderAll();
input.focus({preventScroll: true});
loadPreview();
if (!STATIC) {
  // Live mode: the dev server re-records the CLI whenever Go source changes.
  const events = new EventSource('/events');
  let last = '';
  events.onmessage = e => { const s = JSON.parse(e.data); const sig = s.revision + s.building + s.error + s.fixtures; if (sig !== last) { last = sig; loadPreview(); } };
}
  </script>
</body>
