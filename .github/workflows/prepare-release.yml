name: Prepare release

# Open a draft release with generated notes at the commit to release. Publish the
# draft with publish-release.yml, or from the Releases page, once production
# serves the API the generated client uses: publishing creates the vX.Y.Z tag,
# which runs release.yml.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (X.Y.Z or vX.Y.Z; empty for the next patch)
        required: false
        type: string
        default: ""
      target_sha:
        description: Full SHA of the main commit to release (empty for the current main)
        required: false
        type: string
        default: ""

permissions:
  contents: read

# Preparation and publication change the same releases: never run them at once,
# and queue every request so a pending publication is never dropped.
concurrency:
  group: release
  cancel-in-progress: false
  queue: max

jobs:
  draft:
    if: github.repository == 'nottelabs/notte-cli' && github.ref == 'refs/heads/main'
    name: Check and draft the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Choose the commit and version
        id: target
        env:
          VERSION: ${{ inputs.version }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          target="${TARGET_SHA:-$GITHUB_SHA}"
          if ! [[ "$target" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Expected a full 40-character commit SHA, got '$target'"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$target" "$GITHUB_SHA"; then
            echo "::error::$target is not a commit on main"
            exit 1
          fi
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          # GoReleaser commits the Homebrew formula to main after each release;
          # that alone is not a change to release.
          if [ -n "$latest" ] && git diff --quiet "$latest" "$target" -- . ':(exclude)Formula'; then
            echo "Nothing to release: $target has no changes since $latest" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$VERSION" ]; then
            tag="v${VERSION#v}"
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            tag="v$major.$minor.$((patch + 1))"
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a version X.Y.Z, got '$tag'"
            exit 1
          fi
          {
            echo "sha=$target"
            echo "tag=$tag"
            echo "skip=false"
          } >> "$GITHUB_OUTPUT"

      - name: Check the release is not published yet
        id: existing
        if: steps.target.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.target.outputs.tag }}
          TARGET: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          tags=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" \
            --jq ".[] | select(.ref == \"refs/tags/$TAG\") | .ref")
          # Drafts have no tag yet, so look for them among the releases.
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.draft) | [.id, .tag_name, .target_commitish, .html_url] | @tsv")
          published=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$TAG\" and (.draft | not)) | .html_url")
          if [ -n "$tags$published" ]; then
            echo "::error::$TAG already exists: ${published:-tag $TAG}"
            exit 1
          fi
          # Keep a draft of the same version and commit, with any edited notes.
          # Every other draft is replaced, so only one release waits to publish.
          kept=$(awk -F '\t' -v tag="$TAG" -v target="$TARGET" '$2 == tag && $3 == target { print $4; exit }' <<< "$releases")
          stale=$(awk -F '\t' -v kept="$kept" '$4 != kept { print $1 }' <<< "$releases")
          echo "kept=$kept" >> "$GITHUB_OUTPUT"
          echo "stale=$(paste -sd ' ' - <<< "$stale")" >> "$GITHUB_OUTPUT"

      - name: Draft the release
        if: steps.target.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.target.outputs.tag }}
          TARGET: ${{ steps.target.outputs.sha }}
          KEPT: ${{ steps.existing.outputs.kept }}
          STALE: ${{ steps.existing.outputs.stale }}
        run: |
          set -euo pipefail
          for id in $STALE; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            echo "Deleted the draft $id, which targeted another version or commit"
          done
          if [ -n "$KEPT" ]; then
            echo "Draft release for $TARGET already exists: $KEPT" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          url=$(gh release create "$TAG" --draft --target "$TARGET" --title "$TAG" --generate-notes)
          echo "Draft release for $TARGET: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "Review the notes and publish the draft: $url"
