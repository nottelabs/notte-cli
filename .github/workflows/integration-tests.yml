name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Not the default set (opened, synchronize, reopened). Retargeting a
    # stacked PR onto main after its parent merges fires `edited` and nothing
    # else, so without this the retargeted PR gets no checks whatsoever - not
    # a red X, an empty checks list that reads as fine.
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch: # Manual trigger

env:
  GO_VERSION: '1.25.5'

jobs:
  integration:
    # `edited` fires on every title and description edit too, so the job
    # itself checks that the base is what changed. `changes.base` is present
    # in the payload only when it was (carrying base.ref.from and
    # base.sha.from); a prose edit sends changes.title or changes.body and
    # this skips. On push there is no action at all, so the guard is a no-op.
    if: github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build CLI
        run: go build -o notte ./cmd/notte

      - name: Run Integration Tests
        env:
          NOTTE_API_KEY: ${{ secrets.NOTTE_API_KEY }}
          NOTTE_API_URL: https://us-staging.notte.cc
        run: |
          if [ -z "$NOTTE_API_KEY" ]; then
            echo "::error::NOTTE_API_KEY secret is not configured. Please add it in Settings > Secrets and variables > Actions"
            exit 1
          fi
          go test -v -tags=integration -timeout=20m ./tests/integration/...

  observe-parity:
    # `page observe` against the Python SDK's observation of the same pages: one session, about 30 s.
    if: github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/parity/requirements.txt

      - name: Build CLI
        run: go build -o notte ./cmd/notte

      - name: Install the Python SDK
        run: pip install -r tests/parity/requirements.txt

      - name: Test the parity checker
        run: python -I -m unittest discover -s tests/parity

      - name: Compare page observe with the Python SDK
        env:
          NOTTE_API_KEY: ${{ secrets.NOTTE_API_KEY }}
          NOTTE_API_URL: https://us-staging.notte.cc
        run: |
          if [ -z "$NOTTE_API_KEY" ]; then
            echo "::error::NOTTE_API_KEY secret is not configured. Please add it in Settings > Secrets and variables > Actions"
            exit 1
          fi
          python -I tests/parity/observe_parity.py --cli ./notte
