version: 2

project_name: notte-cli

builds:
  - id: notte-darwin
    main: ./cmd/notte
    binary: notte
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}

  - id: notte-other
    main: ./cmd/notte
    binary: notte
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}

# Sign the darwin binaries with the Notte Labs Developer ID Application
# certificate and notarize them. macOS ties a Keychain "Always Allow" to the
# signing team, so it carries over from one release to the next; with the
# linker's ad-hoc signature it was tied to each binary's hash. Skipped while
# the MACOS_SIGN_P12 secret is not set.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - notte-darwin
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

release:
  replace_existing_artifacts: true
  # publish-release.yml tags the commit of a draft with generated notes. Upload
  # into that draft (found by its name, the tag) and keep its notes; GoReleaser
  # publishes it only after the upload.
  use_existing_draft: true

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch

brews:
  - name: notte
    repository:
      owner: nottelabs
      name: notte-cli
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
      branch: main
    directory: Formula
    homepage: "https://notte.cc"
    description: "Browser automation CLI for notte.cc"
    license: "MIT"
    install: |
      bin.install "notte"
    test: |
      system "#{bin}/notte", "version"

