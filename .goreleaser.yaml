version: 2

project_name: notte-cli

builds:
  - id: notte-darwin
    main: ./cmd/notte
    binary: notte
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}

  - id: notte-other
    main: ./cmd/notte
    binary: notte
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

release:
  replace_existing_artifacts: true
  # publish-release.yml tags the commit of a draft with generated notes. Upload
  # into that draft (found by its name, the tag) and keep its notes; GoReleaser
  # publishes it only after the upload.
  use_existing_draft: true

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch

brews:
  - name: notte
    repository:
      owner: nottelabs
      name: notte-cli
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
      branch: main
    directory: Formula
    homepage: "https://notte.cc"
    description: "Browser automation CLI for notte.cc"
    license: "MIT"
    install: |
      bin.install "notte"
    test: |
      system "#{bin}/notte", "version"

